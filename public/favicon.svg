<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="64" height="64" rx="12" fill="#0D1117"/>

  <!-- Geometric "A" shape with circuit lines -->
  <!-- Main A strokes -->
  <path d="M32 8 L52 52 L42 52 L32 28 L22 52 L12 52 Z" fill="none" stroke="url(#grad1)" stroke-width="2.5" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Cross bar -->
  <line x1="18" y1="38" x2="46" y2="38" stroke="url(#grad1)" stroke-width="2" filter="url(#glow)"/>

  <!-- Neural nodes at vertices -->
  <circle cx="32" cy="8"  r="2.5" fill="#8B5CF6" filter="url(#glow)"/>
  <circle cx="52" cy="52" r="2.5" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="12" cy="52" r="2.5" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="18" cy="38" r="1.8" fill="#8B5CF6" opacity="0.8"/>
  <circle cx="46" cy="38" r="1.8" fill="#06B6D4" opacity="0.8"/>

  <!-- Micro circuit dots on the strokes -->
  <circle cx="24" cy="28" r="1.2" fill="#8B5CF6" opacity="0.6"/>
  <circle cx="40" cy="28" r="1.2" fill="#06B6D4" opacity="0.6"/>
  <circle cx="32" cy="18" r="1.2" fill="#a78bfa" opacity="0.7"/>
</svg>